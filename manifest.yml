name: ZtoApi
package: community.lazycat.app.ztoapi
version: 0.1.0
min_os_version: 1.3.8
description: z.ai助手
homepage: hulisang/ztoapi
author: hulisang

application:
  subdomain: ztoapi
  public_path:
    - /

  upstreams:
    - location: /
      backend: http://ztoapi:9090

services:
  ztoapi:
    image: docker.1ms.run/hulisang/ztoapi:latest
    environment:
      - DEFAULT_KEY={{.U.default_key}}
      - ZAI_TOKEN={{.U.zai_token}}
      - MODEL_NAME={{.U.model_name}}
      - UPSTREAM_URL={{.U.upstream_url}}
      - ADMIN_USERNAME={{.U.admin_username}}
      - ADMIN_PASSWORD={{.U.admin_password}}
      - PORT=9090
      - DEBUG_MODE=false
      - DEFAULT_STREAM={{.U.enable_stream}}
      - ENABLE_THINKING={{.U.enable_thinking}}
    binds:
      - /lzcapp/var/data:/app/data
