version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/ztoapi.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: ztoapi
    bump: patch

build:
  run_buildscript: false

images:
  - id: ztoapi
    target: service
    service: ztoapi
    source: hulisang/ztoapi
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    name: ZtoApi
    summary: "z.ai 助手"
